<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Builders Daily Digest</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* Theme variables */
    :root {
      --bg: #121212;
      --bg-surface: #1a1a1a;
      --text: #e0dcd6;
      --text-muted: #888;
      --text-heading: #f0ece6;
      --border: #2a2a2a;
      --border-double: #e0dcd6;
      --accent: #c0a060;
      --accent-hover: #d4b87a;
      --link: #c0a060;
      --link-hover: #d4b87a;
      --blockquote-bg: rgba(192,160,96,0.08);
      --blockquote-text: #bbb;
      --btn-bg: #222;
      --btn-text: #ccc;
      --btn-border: #444;
      --btn-active-bg: #e0dcd6;
      --btn-active-text: #111;
      --btn-active-border: #e0dcd6;
      --nav-arrow-bg: #1a1a1a;
      --nav-arrow-text: #ccc;
      --nav-arrow-border: #444;
      --error: #e07070;
      --spinner-track: #333;
      --spinner-head: #888;
      --raw-bg: #1e1e1e;
    }
    body.light {
      --bg: #faf9f6;
      --bg-surface: #fff;
      --text: #2c2c2c;
      --text-muted: #888;
      --text-heading: #111;
      --border: #e8e4de;
      --border-double: #222;
      --accent: #c0a060;
      --accent-hover: #a08040;
      --link: #8b5e3c;
      --link-hover: #5a3a22;
      --blockquote-bg: rgba(192,160,96,0.06);
      --blockquote-text: #555;
      --btn-bg: #fff;
      --btn-text: #666;
      --btn-border: #ccc;
      --btn-active-bg: #222;
      --btn-active-text: #fff;
      --btn-active-border: #222;
      --nav-arrow-bg: #fff;
      --nav-arrow-text: #444;
      --nav-arrow-border: #ccc;
      --error: #a04040;
      --spinner-track: #ddd;
      --spinner-head: #555;
      --raw-bg: #f5f3ef;
    }

    body {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 18px;
      line-height: 1.8;
      color: var(--text);
      background: var(--bg);
      transition: background 0.3s ease, color 0.3s ease;
    }

    /* Magazine Header */
    header {
      text-align: center;
      padding: 3rem 1rem 2rem;
      border-bottom: 3px double var(--border-double);
      max-width: 720px;
      margin: 0 auto;
    }
    header h1 {
      font-family: Georgia, serif;
      font-size: 2.5rem;
      font-weight: 400;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: var(--text-heading);
    }
    header .edition {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 0.5rem;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 1px;
    }
    header .divider {
      width: 60px;
      height: 2px;
      background: var(--text-heading);
      margin: 1rem auto 0;
    }

    /* Toolbar */
    .toolbar {
      max-width: 720px;
      margin: 0 auto;
      padding: 0.6rem 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 0.8rem;
      border-bottom: 1px solid var(--border);
    }
    .toolbar .group { display: flex; align-items: center; gap: 0.3rem; }
    .toolbar .group-label { color: var(--text-muted); margin-right: 0.3rem; }
    .toolbar button {
      padding: 0.25rem 0.7rem;
      border: 1px solid var(--btn-border);
      background: var(--btn-bg);
      color: var(--btn-text);
      font-size: 0.8rem;
      cursor: pointer;
      border-radius: 4px;
    }
    .toolbar button.active {
      background: var(--btn-active-bg);
      color: var(--btn-active-text);
      border-color: var(--btn-active-border);
    }

    /* Main content */
    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 2rem 1rem 4rem;
      transition: max-width 0.3s ease;
    }
    body.two-page main {
      max-width: 1200px;
    }
    body.two-page #digest {
      column-count: 2;
      column-gap: 3rem;
      column-rule: 1px solid var(--border);
    }
    body.two-page #digest h2 {
      column-span: all;
    }
    body.two-page header,
    body.two-page .toolbar,
    body.two-page footer {
      max-width: 1200px;
    }

    /* Digest content - magazine typography */
    #digest {
      font-size: 1.05rem;
      line-height: 1.85;
    }
    #digest h2 {
      font-family: Georgia, serif;
      font-size: 1.6rem;
      font-weight: 400;
      margin: 2.5rem 0 1rem;
      padding-bottom: 0.4rem;
      border-bottom: 1px solid var(--border);
      color: var(--text-heading);
    }
    #digest h3 {
      font-family: Georgia, serif;
      font-size: 1.2rem;
      font-weight: 700;
      margin: 1.8rem 0 0.6rem;
      color: var(--text-heading);
    }
    #digest p {
      margin-bottom: 1rem;
      text-align: justify;
      hyphens: auto;
    }
    #digest blockquote {
      margin: 1.2rem 0;
      padding: 0.8rem 1.2rem;
      border-left: 3px solid var(--accent);
      background: var(--blockquote-bg);
      font-style: italic;
      color: var(--blockquote-text);
    }
    #digest ul, #digest ol {
      margin: 0.8rem 0 1rem 1.5rem;
    }
    #digest li { margin-bottom: 0.4rem; }
    #digest a { color: var(--link); text-decoration: underline; text-underline-offset: 2px; }
    #digest a:hover { color: var(--link-hover); }
    #digest strong { font-weight: 700; color: var(--text-heading); }
    #digest em { font-style: italic; }
    #digest hr {
      border: none;
      height: 1px;
      background: var(--border);
      margin: 2rem 0;
    }
    #digest .lead {
      font-size: 1.15rem;
      font-style: italic;
      color: var(--text-muted);
      margin-bottom: 1.5rem;
    }

    /* Loading / status states */
    .loading-state {
      text-align: center;
      padding: 4rem 1rem;
      font-family: -apple-system, sans-serif;
      color: var(--text-muted);
    }
    .loading-state .spinner {
      display: inline-block;
      width: 28px;
      height: 28px;
      border: 3px solid var(--spinner-track);
      border-top-color: var(--spinner-head);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-state p { font-size: 0.9rem; margin-top: 0.5rem; }

    .error-state {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--error);
      font-family: -apple-system, sans-serif;
      font-size: 0.9rem;
    }
    .error-state button {
      margin-top: 1rem;
      padding: 0.4rem 1.2rem;
      border: 1px solid var(--error);
      border-radius: 6px;
      background: var(--bg-surface);
      color: var(--error);
      cursor: pointer;
      font-weight: 600;
    }

    /* Person tooltip */
    .person-tooltip {
      position: fixed;
      z-index: 1000;
      max-width: 320px;
      padding: 0.8rem 1rem;
      background: #1a1a1a;
      color: #f0ece6;
      border-radius: 8px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 0.82rem;
      line-height: 1.5;
      box-shadow: 0 4px 20px rgba(0,0,0,0.25);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s ease;
    }
    .person-tooltip.visible { opacity: 1; }
    .person-tooltip .tt-name {
      font-weight: 700;
      font-size: 0.9rem;
      color: #fff;
    }
    .person-tooltip .tt-handle {
      color: #8b5e3c;
      font-size: 0.78rem;
      margin-left: 0.3rem;
    }
    .person-tooltip .tt-bio {
      margin-top: 0.35rem;
      color: #ccc;
      font-style: italic;
    }
    #digest a[data-handle] {
      text-decoration-style: dotted;
      text-decoration-color: var(--accent);
    }

    /* Book-flip page navigation */
    .page-nav {
      max-width: 720px;
      margin: 0 auto;
      padding: 0.5rem 1rem;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1.2rem;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 0.82rem;
      border-bottom: 1px solid var(--border);
      user-select: none;
    }
    body.two-page .page-nav { max-width: 1200px; }
    .page-nav .nav-arrow {
      width: 36px;
      height: 36px;
      border: 1px solid var(--nav-arrow-border);
      border-radius: 50%;
      background: var(--nav-arrow-bg);
      color: var(--nav-arrow-text);
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }
    .page-nav .nav-arrow:hover:not(:disabled) { background: var(--accent); color: #111; border-color: var(--accent); }
    .page-nav .nav-arrow:disabled { opacity: 0.25; cursor: default; }
    .page-nav .nav-center {
      text-align: center;
      min-width: 140px;
    }
    .page-nav .nav-date {
      font-weight: 600;
      color: var(--text-heading);
      font-size: 0.88rem;
    }
    .page-nav .nav-pos {
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-top: 0.1rem;
    }

    /* Page flip animation */
    .book-wrapper {
      perspective: 1200px;
      overflow: hidden;
    }
    .book-page {
      transform-origin: left center;
      transition: transform 0.5s ease, opacity 0.5s ease;
    }
    .book-page.flip-out-fwd {
      animation: flipOutFwd 0.45s ease-in forwards;
    }
    .book-page.flip-in-fwd {
      animation: flipInFwd 0.45s ease-out forwards;
    }
    .book-page.flip-out-back {
      animation: flipOutBack 0.45s ease-in forwards;
    }
    .book-page.flip-in-back {
      animation: flipInBack 0.45s ease-out forwards;
    }
    @keyframes flipOutFwd {
      0% { transform: rotateY(0deg); opacity: 1; }
      100% { transform: rotateY(-90deg); opacity: 0; }
    }
    @keyframes flipInFwd {
      0% { transform: rotateY(90deg); opacity: 0; }
      100% { transform: rotateY(0deg); opacity: 1; }
    }
    @keyframes flipOutBack {
      0% { transform: rotateY(0deg); opacity: 1; }
      100% { transform: rotateY(90deg); opacity: 0; }
    }
    @keyframes flipInBack {
      0% { transform: rotateY(-90deg); opacity: 0; }
      100% { transform: rotateY(0deg); opacity: 1; }
    }

    /* Selection popup */
    .sel-popup {
      position: fixed;
      z-index: 1001;
      background: var(--accent);
      color: #111;
      border-radius: 6px;
      padding: 0.3rem 0.6rem;
      font-family: -apple-system, sans-serif;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 2px 12px rgba(0,0,0,0.4);
      display: none;
      user-select: none;
    }
    .sel-popup:hover { background: var(--accent-hover); }

    /* Explanation panel */
    .explain-panel {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 1002;
      background: #1a1a1a;
      color: #f0ece6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 0.88rem;
      line-height: 1.6;
      max-height: 40vh;
      overflow-y: auto;
      box-shadow: 0 -4px 24px rgba(0,0,0,0.3);
      transform: translateY(100%);
      transition: transform 0.25s ease;
    }
    .explain-panel.open { transform: translateY(0); }
    .explain-panel .ep-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 0.8rem 1.2rem 0.4rem;
      border-bottom: 1px solid #333;
    }
    .explain-panel .ep-query {
      font-weight: 700;
      color: #c0a060;
      font-size: 0.82rem;
      max-width: 80%;
      word-break: break-word;
    }
    .explain-panel .ep-close {
      background: none;
      border: none;
      color: #888;
      font-size: 1.2rem;
      cursor: pointer;
      padding: 0 0.3rem;
    }
    .explain-panel .ep-close:hover { color: #fff; }
    .explain-panel .ep-body {
      padding: 0.6rem 1.2rem 1rem;
    }
    .explain-panel .ep-cached {
      font-size: 0.7rem;
      color: #666;
      margin-top: 0.4rem;
    }
    .explain-panel .ep-loading {
      color: #888;
      font-style: italic;
    }

    /* Footer */
    footer {
      max-width: 720px;
      margin: 0 auto;
      text-align: center;
      padding: 2rem 1rem;
      font-family: -apple-system, sans-serif;
      font-size: 0.75rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border);
    }
    footer a { color: var(--text-muted); }

    /* Prevent light flash on load when dark is default */
    html.light-preload body { background: #faf9f6; color: #2c2c2c; }

    /* Label toggling */
    .toolbar .short-label { display: none; }

    /* Responsive */
    @media (max-width: 640px) {
      header h1 { font-size: 1.6rem; letter-spacing: 3px; }
      main { padding: 1.5rem 1rem 3rem; }
      #digest { font-size: 1rem; }
      .toolbar .group-label { display: none; }
      .toolbar .full-label { display: none; }
      .toolbar .short-label { display: inline; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Daily Digest</h1>
    <p class="edition" id="edition">Loading...</p>
    <div class="divider"></div>
  </header>

  <div class="toolbar">
    <div class="group">
      <span class="group-label">Lang:</span>
      <button id="btn-en" class="active" onclick="switchLang('en')">EN</button>
      <button id="btn-zh" onclick="switchLang('zh')"><span class="full-label">中文</span><span class="short-label">中</span></button>
    </div>
    <div class="group">
      <span class="group-label">View:</span>
      <button id="btn-1col" class="active" onclick="switchView(1)"><span class="full-label">1 Column</span><span class="short-label">1</span></button>
      <button id="btn-2col" onclick="switchView(2)"><span class="full-label">2 Column</span><span class="short-label">2</span></button>
    </div>
    <div class="group">
      <button id="btn-theme" onclick="toggleTheme()" title="Toggle light/dark mode">Dark</button>
    </div>
  </div>

  <div class="page-nav" id="page-nav">
    <button class="nav-arrow" id="nav-prev" onclick="flipPage(-1)" disabled>&larr;</button>
    <div class="nav-center">
      <div class="nav-date" id="nav-date">...</div>
      <div class="nav-pos" id="nav-pos"></div>
    </div>
    <button class="nav-arrow" id="nav-next" onclick="flipPage(1)" disabled>&rarr;</button>
  </div>

  <main>
    <div class="book-wrapper">
      <div class="book-page" id="digest">
        <div class="loading-state" id="loading">
          <div class="spinner"></div>
          <p>Fetching today's feed...</p>
        </div>
      </div>
    </div>
  </main>

  <div class="person-tooltip" id="person-tooltip"></div>
  <div class="sel-popup" id="sel-popup">Search with AI</div>
  <div class="explain-panel" id="explain-panel">
    <div class="ep-header">
      <div class="ep-query" id="ep-query"></div>
      <button class="ep-close" onclick="closeExplain()">&times;</button>
    </div>
    <div class="ep-body" id="ep-body"></div>
  </div>

  <footer>
    Powered by <a href="https://github.com/zarazhangrui/follow-builders" target="_blank">follow-builders</a>
  </footer>

  <script>
    // --- Theme (runs immediately to avoid flash) ---
    let isDark = localStorage.getItem('theme') !== 'light'; // default dark
    function applyTheme() {
      document.body.classList.toggle('light', !isDark);
      const btn = document.getElementById('btn-theme');
      if (btn) btn.textContent = isDark ? 'Dark' : 'Light';
    }
    // Apply before paint
    if (!isDark) document.documentElement.classList.add('light-preload');

    function toggleTheme() {
      isDark = !isDark;
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      applyTheme();
    }

    let digestData = null;
    let currentLang = 'en';
    let currentDate = null;
    let availableDates = [];

    document.addEventListener('DOMContentLoaded', () => {
      applyTheme();
      init();
    });

    // --- Init ---
    async function init() {
      await loadDates();
      if (availableDates.length) {
        currentDate = availableDates[0]; // most recent
        updatePageNav();
        await loadDigest(currentDate);
      } else {
        document.getElementById('digest').innerHTML =
          '<div class="error-state"><p>No digests found. Run "npm run generate" first.</p></div>';
      }
      initSelectionPopup();

      // Keyboard nav: left = older, right = newer
      document.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
        if (e.key === 'ArrowLeft') flipPage(-1);
        if (e.key === 'ArrowRight') flipPage(1);
      });
    }

    let flipping = false;

    // --- Date navigation ---
    async function loadDates() {
      try {
        const res = await fetch('/digests/index.json');
        availableDates = await res.json();
      } catch {
        availableDates = [];
      }
      updatePageNav();
    }

    function currentIndex() {
      return availableDates.indexOf(currentDate);
    }

    function updatePageNav() {
      const idx = currentIndex();
      const total = availableDates.length;

      document.getElementById('nav-prev').disabled = idx >= total - 1;
      document.getElementById('nav-next').disabled = idx <= 0;

      if (currentDate) {
        const d = new Date(currentDate + 'T12:00:00');
        document.getElementById('nav-date').textContent =
          d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
        document.getElementById('nav-pos').textContent =
          total > 1 ? `${total - idx} of ${total} issues` : '';
      }
    }

    async function flipPage(direction) {
      if (flipping) return;
      const idx = currentIndex();
      // direction -1 = older (prev), +1 = newer (next)
      // dates are sorted newest-first, so older = higher index
      const newIdx = idx - direction;
      if (newIdx < 0 || newIdx >= availableDates.length) return;

      flipping = true;
      const page = document.getElementById('digest');
      const outClass = direction > 0 ? 'flip-out-fwd' : 'flip-out-back';
      const inClass = direction > 0 ? 'flip-in-fwd' : 'flip-in-back';

      // Flip out
      page.classList.add(outClass);
      await new Promise(r => setTimeout(r, 420));
      page.classList.remove(outClass);

      // Load new content
      currentDate = availableDates[newIdx];
      updatePageNav();
      await loadDigest(currentDate);

      // Flip in
      page.classList.add(inClass);
      await new Promise(r => setTimeout(r, 450));
      page.classList.remove(inClass);
      flipping = false;
    }

    // --- Load digest ---
    async function loadDigest(date) {
      const digestEl = document.getElementById('digest');
      const editionEl = document.getElementById('edition');

      digestEl.innerHTML = '<div class="loading-state"><div class="spinner"></div><p>Loading digest...</p></div>';

      try {
        const res = await fetch(`/digests/${date}.json`);
        if (!res.ok) throw new Error('Digest not found.');
        digestData = await res.json();

        if (digestData.generatedAt) {
          const d = new Date(digestData.generatedAt);
          editionEl.textContent = d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
        } else {
          editionEl.textContent = digestData.date || date;
        }

        renderLang(currentLang);
      } catch (e) {
        digestEl.innerHTML = `<div class="error-state"><p>${e.message}</p></div>`;
        editionEl.textContent = '';
      }
    }

    // --- Language ---
    function renderLang(lang) {
      if (!digestData) return;
      const digestEl = document.getElementById('digest');
      const html = lang === 'zh' ? (digestData.html_zh || digestData.html || '') : (digestData.html_en || digestData.html || '');
      digestEl.innerHTML = html;
      initTooltips();
    }

    function switchLang(lang) {
      currentLang = lang;
      document.getElementById('btn-en').classList.toggle('active', lang === 'en');
      document.getElementById('btn-zh').classList.toggle('active', lang === 'zh');
      renderLang(lang);
    }

    // --- View ---
    function switchView(cols) {
      document.body.classList.toggle('two-page', cols === 2);
      document.getElementById('btn-1col').classList.toggle('active', cols === 1);
      document.getElementById('btn-2col').classList.toggle('active', cols === 2);
    }

    // --- Person tooltips ---
    const tooltip = document.getElementById('person-tooltip');
    let tooltipTimeout = null;

    function initTooltips() {
      document.querySelectorAll('#digest a[data-handle]').forEach(link => {
        link.addEventListener('mouseenter', showTooltip);
        link.addEventListener('mouseleave', hideTooltip);
      });
    }

    function showTooltip(e) {
      const handle = e.target.getAttribute('data-handle');
      if (!handle || !digestData?.builders) return;
      const person = digestData.builders[handle.toLowerCase()];
      if (!person) return;

      clearTimeout(tooltipTimeout);
      tooltip.innerHTML = `
        <div class="tt-name">${person.name}<span class="tt-handle">@${person.handle}</span></div>
        <div class="tt-bio">${person.bio}</div>
      `;
      const rect = e.target.getBoundingClientRect();
      tooltip.style.left = Math.min(rect.left, window.innerWidth - 340) + 'px';
      tooltip.style.top = (rect.bottom + 8) + 'px';
      tooltip.classList.add('visible');
    }

    function hideTooltip() {
      tooltipTimeout = setTimeout(() => tooltip.classList.remove('visible'), 100);
    }

    // --- Selection popup + AI explain ---
    const selPopup = document.getElementById('sel-popup');
    let selectedText = '';

    function initSelectionPopup() {
      document.addEventListener('mouseup', (e) => {
        // Ignore clicks on the popup itself
        if (e.target.closest('.sel-popup') || e.target.closest('.explain-panel')) return;

        const sel = window.getSelection();
        const text = sel.toString().trim();

        if (text.length >= 3 && document.getElementById('digest').contains(sel.anchorNode)) {
          selectedText = text.substring(0, 500);
          const range = sel.getRangeAt(0);
          const rect = range.getBoundingClientRect();
          selPopup.style.left = (rect.left + rect.width / 2 - 55) + 'px';
          selPopup.style.top = (rect.top - 36) + 'px';
          selPopup.style.display = 'block';
        } else {
          selPopup.style.display = 'none';
        }
      });

      // Hide popup on scroll
      document.addEventListener('scroll', () => { selPopup.style.display = 'none'; }, true);

      selPopup.addEventListener('click', () => {
        selPopup.style.display = 'none';
        explainText(selectedText);
      });
    }

    async function explainText(text) {
      const panel = document.getElementById('explain-panel');
      const queryEl = document.getElementById('ep-query');
      const bodyEl = document.getElementById('ep-body');

      queryEl.textContent = text.length > 120 ? text.substring(0, 120) + '...' : text;
      bodyEl.innerHTML = '<div class="ep-loading">Thinking...</div>';
      panel.classList.add('open');

      try {
        const res = await fetch('/api/explain', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text }),
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error);

        bodyEl.innerHTML = `<div>${data.explanation}</div>` +
          (data.cached ? '<div class="ep-cached">Served from cache — no tokens used</div>' : '<div class="ep-cached">Freshly generated — saved to cache for future lookups</div>');
      } catch (e) {
        bodyEl.innerHTML = `<div style="color:#e07070">Error: ${e.message}</div>`;
      }
    }

    function closeExplain() {
      document.getElementById('explain-panel').classList.remove('open');
    }
  </script>
