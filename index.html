<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Builders Daily Digest</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 18px;
      line-height: 1.8;
      color: #2c2c2c;
      background: #faf9f6;
    }

    /* Magazine Header */
    header {
      text-align: center;
      padding: 3rem 1rem 2rem;
      border-bottom: 3px double #222;
      max-width: 720px;
      margin: 0 auto;
    }
    header h1 {
      font-family: Georgia, serif;
      font-size: 2.5rem;
      font-weight: 400;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: #111;
    }
    header .edition {
      font-size: 0.85rem;
      color: #888;
      margin-top: 0.5rem;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 1px;
    }
    header .divider {
      width: 60px;
      height: 2px;
      background: #111;
      margin: 1rem auto 0;
    }

    /* API Key Bar */
    .api-bar {
      max-width: 720px;
      margin: 0 auto;
      padding: 0.75rem 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 0.8rem;
      border-bottom: 1px solid #e8e4de;
    }
    .api-bar label { color: #888; white-space: nowrap; }
    .api-bar input {
      flex: 1;
      padding: 0.35rem 0.6rem;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 0.8rem;
      font-family: monospace;
      background: #fff;
    }
    .api-bar button {
      padding: 0.35rem 1rem;
      border: 1px solid #222;
      border-radius: 6px;
      background: #222;
      color: #fff;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      font-family: -apple-system, sans-serif;
      white-space: nowrap;
    }
    .api-bar button:hover { background: #444; }
    .api-bar .status { color: #888; font-style: italic; }

    /* Main content */
    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 2rem 1rem 4rem;
    }

    /* Digest content - magazine typography */
    #digest {
      font-size: 1.05rem;
      line-height: 1.85;
    }
    #digest h2 {
      font-family: Georgia, serif;
      font-size: 1.6rem;
      font-weight: 400;
      margin: 2.5rem 0 1rem;
      padding-bottom: 0.4rem;
      border-bottom: 1px solid #ddd;
      color: #111;
    }
    #digest h3 {
      font-family: Georgia, serif;
      font-size: 1.2rem;
      font-weight: 700;
      margin: 1.8rem 0 0.6rem;
      color: #222;
    }
    #digest p {
      margin-bottom: 1rem;
      text-align: justify;
      hyphens: auto;
    }
    #digest blockquote {
      margin: 1.2rem 0;
      padding: 0.8rem 1.2rem;
      border-left: 3px solid #c0a060;
      background: rgba(192,160,96,0.06);
      font-style: italic;
      color: #555;
    }
    #digest ul, #digest ol {
      margin: 0.8rem 0 1rem 1.5rem;
    }
    #digest li { margin-bottom: 0.4rem; }
    #digest a { color: #8b5e3c; text-decoration: underline; text-underline-offset: 2px; }
    #digest a:hover { color: #5a3a22; }
    #digest strong { font-weight: 700; color: #111; }
    #digest em { font-style: italic; }
    #digest hr {
      border: none;
      height: 1px;
      background: #ddd;
      margin: 2rem 0;
    }
    #digest .lead {
      font-size: 1.15rem;
      font-style: italic;
      color: #555;
      margin-bottom: 1.5rem;
    }

    /* Loading / status states */
    .loading-state {
      text-align: center;
      padding: 4rem 1rem;
      font-family: -apple-system, sans-serif;
      color: #888;
    }
    .loading-state .spinner {
      display: inline-block;
      width: 28px;
      height: 28px;
      border: 3px solid #ddd;
      border-top-color: #555;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-state p { font-size: 0.9rem; margin-top: 0.5rem; }

    .error-state {
      text-align: center;
      padding: 3rem 1rem;
      color: #a04040;
      font-family: -apple-system, sans-serif;
      font-size: 0.9rem;
    }
    .error-state button {
      margin-top: 1rem;
      padding: 0.4rem 1.2rem;
      border: 1px solid #a04040;
      border-radius: 6px;
      background: #fff;
      color: #a04040;
      cursor: pointer;
      font-weight: 600;
    }

    /* Raw feed toggle */
    .raw-toggle {
      text-align: center;
      margin-top: 2rem;
      font-family: -apple-system, sans-serif;
    }
    .raw-toggle button {
      padding: 0.4rem 1rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: #fff;
      color: #666;
      font-size: 0.8rem;
      cursor: pointer;
    }
    #raw-feed {
      display: none;
      margin-top: 1.5rem;
      padding: 1rem;
      background: #f5f3ef;
      border-radius: 8px;
      font-family: -apple-system, sans-serif;
      font-size: 0.82rem;
      line-height: 1.6;
      max-height: 600px;
      overflow-y: auto;
    }
    #raw-feed .raw-item {
      padding: 0.6rem 0;
      border-bottom: 1px solid #e8e4de;
    }
    #raw-feed .raw-item:last-child { border-bottom: none; }
    #raw-feed .raw-meta { color: #999; font-size: 0.75rem; }

    /* Footer */
    footer {
      max-width: 720px;
      margin: 0 auto;
      text-align: center;
      padding: 2rem 1rem;
      font-family: -apple-system, sans-serif;
      font-size: 0.75rem;
      color: #bbb;
      border-top: 1px solid #e8e4de;
    }
    footer a { color: #999; }

    /* Responsive */
    @media (max-width: 640px) {
      header h1 { font-size: 1.6rem; letter-spacing: 3px; }
      main { padding: 1.5rem 1rem 3rem; }
      #digest { font-size: 1rem; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Daily Digest</h1>
    <p class="edition" id="edition">Loading...</p>
    <div class="divider"></div>
  </header>

  <div class="api-bar">
    <label>Claude API Key:</label>
    <input type="password" id="api-key" placeholder="sk-ant-..." />
    <button onclick="saveKeyAndGenerate()">Generate Digest</button>
    <span class="status" id="api-status"></span>
  </div>

  <main>
    <div id="digest">
      <div class="loading-state" id="loading">
        <div class="spinner"></div>
        <p>Fetching today's feed...</p>
      </div>
    </div>

    <div class="raw-toggle" id="raw-toggle" style="display:none">
      <button onclick="toggleRaw()">Show raw feed items</button>
    </div>
    <div id="raw-feed"></div>
  </main>

  <footer>
    Powered by <a href="https://github.com/zarazhangrui/follow-builders" target="_blank">follow-builders</a>
  </footer>

  <script>
    const BASE = 'https://raw.githubusercontent.com/zarazhangrui/follow-builders/main';
    const FEEDS = {
      x:        `${BASE}/feed-x.json`,
      podcasts: `${BASE}/feed-podcasts.json`,
      blogs:    `${BASE}/feed-blogs.json`,
    };
    const CLAUDE_API = 'https://api.anthropic.com/v1/messages';

    let rawFeedData = null;

    // --- Init ---

    document.addEventListener('DOMContentLoaded', () => {
      const saved = localStorage.getItem('claude-api-key');
      if (saved) document.getElementById('api-key').value = saved;
      loadAndRender();
    });

    // --- API Key ---

    function saveKeyAndGenerate() {
      const key = document.getElementById('api-key').value.trim();
      if (!key) return;
      localStorage.setItem('claude-api-key', key);
      localStorage.removeItem('digest-cache');
      loadAndRender();
    }

    // --- Fetch feeds ---

    async function fetchFeeds() {
      const cacheBust = `?t=${Date.now()}`;
      const results = await Promise.allSettled([
        fetch(FEEDS.x + cacheBust).then(r => r.json()),
        fetch(FEEDS.podcasts + cacheBust).then(r => r.json()),
        fetch(FEEDS.blogs + cacheBust).then(r => r.json()),
      ]);
      return {
        x: results[0].status === 'fulfilled' ? results[0].value : null,
        podcasts: results[1].status === 'fulfilled' ? results[1].value : null,
        blogs: results[2].status === 'fulfilled' ? results[2].value : null,
      };
    }

    // --- Build prompt for Claude ---

    function buildPrompt(feeds) {
      let content = 'Here is today\'s raw feed data from AI builders. Summarize it into a polished, readable magazine-style daily digest.\n\n';

      if (feeds.x && feeds.x.x) {
        content += '=== TWEETS ===\n';
        for (const builder of feeds.x.x) {
          for (const t of builder.tweets) {
            content += `- ${t.text}\n  (${t.likes} likes)\n\n`;
          }
        }
      }

      if (feeds.podcasts && feeds.podcasts.podcasts) {
        content += '=== PODCAST EPISODES ===\n';
        for (const ep of feeds.podcasts.podcasts) {
          const transcript = ep.transcript ? ep.transcript.substring(0, 8000) : '';
          content += `Episode: ${ep.title}\n`;
          if (ep.url) content += `Link: ${ep.url}\n`;
          content += `Transcript excerpt:\n${transcript}\n\n`;
        }
      }

      if (feeds.blogs && feeds.blogs.blogs && feeds.blogs.blogs.length) {
        content += '=== BLOG POSTS ===\n';
        for (const post of feeds.blogs.blogs) {
          const body = post.content ? post.content.substring(0, 5000) : (post.description || '');
          content += `Title: ${post.title}\nLink: ${post.url}\n${body}\n\n`;
        }
      }

      return content;
    }

    // --- Call Claude API ---

    async function callClaude(feedContent, apiKey) {
      const systemPrompt = `You are a magazine editor producing a daily AI industry digest. Write in a sophisticated, engaging editorial voice — like reading The Economist or The Information, but warmer and more conversational.

Rules:
- Do NOT mention author names, Twitter handles, podcast names, or blog sources. The reader doesn't care where it came from — just the insight.
- Group content by THEME or TOPIC, not by source. Find the threads connecting different pieces.
- Write 3-5 thematic sections, each with a bold headline.
- Start with a 1-2 sentence editorial lead that captures the day's most important theme.
- Use blockquotes for particularly striking insights or quotes.
- Include relevant links inline where available.
- Keep it concise — aim for a 3-5 minute read.
- Use HTML formatting: <h2> for section heads, <h3> for sub-topics, <p> for paragraphs, <blockquote> for quotes, <a href> for links, <strong> and <em> for emphasis, <hr> for section breaks.
- Start the output with a <p class="lead"> for the editorial lead paragraph.
- Do NOT wrap output in code blocks. Output clean HTML directly.`;

      const res = await fetch(CLAUDE_API, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': apiKey,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true',
        },
        body: JSON.stringify({
          model: 'claude-sonnet-4-20250514',
          max_tokens: 4096,
          system: systemPrompt,
          messages: [{ role: 'user', content: feedContent }],
        }),
      });

      if (!res.ok) {
        const err = await res.text();
        throw new Error(`API ${res.status}: ${err}`);
      }

      const data = await res.json();
      return data.content[0].text;
    }

    // --- Cache ---

    function getCacheKey(feeds) {
      const ts = feeds.x?.generatedAt || feeds.podcasts?.generatedAt || feeds.blogs?.generatedAt || '';
      return ts.split('T')[0]; // date only
    }

    function getCachedDigest(dateKey) {
      try {
        const cache = JSON.parse(localStorage.getItem('digest-cache') || '{}');
        if (cache.date === dateKey) return cache.html;
      } catch {}
      return null;
    }

    function setCachedDigest(dateKey, html) {
      localStorage.setItem('digest-cache', JSON.stringify({ date: dateKey, html }));
    }

    // --- Render raw feed (toggle) ---

    function renderRawFeed(feeds) {
      const container = document.getElementById('raw-feed');
      let html = '';

      if (feeds.x && feeds.x.x) {
        for (const builder of feeds.x.x) {
          for (const t of builder.tweets) {
            html += `<div class="raw-item">${escapeHtml(t.text)}<br><span class="raw-meta">${t.likes} likes &middot; ${new Date(t.createdAt).toLocaleString()}</span></div>`;
          }
        }
      }
      if (feeds.podcasts && feeds.podcasts.podcasts) {
        for (const ep of feeds.podcasts.podcasts) {
          html += `<div class="raw-item"><strong>${escapeHtml(ep.title)}</strong><br><span class="raw-meta">${new Date(ep.publishedAt).toLocaleString()}</span></div>`;
        }
      }
      if (feeds.blogs && feeds.blogs.blogs) {
        for (const post of feeds.blogs.blogs) {
          html += `<div class="raw-item"><strong>${escapeHtml(post.title)}</strong><br><span class="raw-meta">${escapeHtml(post.author || '')}</span></div>`;
        }
      }

      container.innerHTML = html || '<p style="color:#999;padding:1rem">No raw items.</p>';
    }

    function toggleRaw() {
      const el = document.getElementById('raw-feed');
      el.style.display = el.style.display === 'none' ? 'block' : 'none';
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text || '';
      return div.innerHTML;
    }

    // --- Main flow ---

    async function loadAndRender() {
      const digestEl = document.getElementById('digest');
      const editionEl = document.getElementById('edition');
      const statusEl = document.getElementById('api-status');

      // Show loading
      digestEl.innerHTML = '<div class="loading-state"><div class="spinner"></div><p>Fetching today\'s feed...</p></div>';

      // 1. Fetch feeds
      let feeds;
      try {
        feeds = await fetchFeeds();
        rawFeedData = feeds;
      } catch (e) {
        digestEl.innerHTML = `<div class="error-state"><p>Failed to fetch feeds.</p><button onclick="loadAndRender()">Retry</button></div>`;
        return;
      }

      // Update edition date
      const genAt = feeds.x?.generatedAt || feeds.podcasts?.generatedAt || feeds.blogs?.generatedAt;
      if (genAt) {
        const d = new Date(genAt);
        editionEl.textContent = d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
      }

      // Show raw feed toggle
      renderRawFeed(feeds);
      document.getElementById('raw-toggle').style.display = 'block';

      // 2. Check cache
      const dateKey = getCacheKey(feeds);
      const cached = getCachedDigest(dateKey);
      if (cached) {
        digestEl.innerHTML = cached;
        statusEl.textContent = 'cached';
        return;
      }

      // 3. Check API key
      const apiKey = localStorage.getItem('claude-api-key');
      if (!apiKey) {
        digestEl.innerHTML = `
          <div class="loading-state">
            <p style="font-size:1rem;color:#666">Enter your Claude API key above to generate an AI-summarized magazine digest.</p>
            <p style="margin-top:0.5rem;font-size:0.85rem;color:#999">Your key is stored locally and never sent anywhere except the Anthropic API.</p>
          </div>`;
        return;
      }

      // 4. Call Claude
      digestEl.innerHTML = '<div class="loading-state"><div class="spinner"></div><p>Writing your digest with Claude...</p></div>';
      statusEl.textContent = 'generating...';

      try {
        const prompt = buildPrompt(feeds);
        const html = await callClaude(prompt, apiKey);
        digestEl.innerHTML = html;
        setCachedDigest(dateKey, html);
        statusEl.textContent = 'done';
      } catch (e) {
        console.error(e);
        const msg = e.message.includes('401') ? 'Invalid API key.' : `Error: ${e.message}`;
        digestEl.innerHTML = `<div class="error-state"><p>${escapeHtml(msg)}</p><button onclick="loadAndRender()">Retry</button></div>`;
        statusEl.textContent = 'error';
      }
    }
  </script>
</body>
</html>
